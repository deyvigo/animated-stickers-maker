[project]
name = "stickers-server"
version = "0.1.0"
description = "Backend for animated-stickers-maker: downloads TikTok videos and renders WhatsApp stickers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2024.12.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiofiles>=24.1",
    "python-multipart>=0.0.12",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
